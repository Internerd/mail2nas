name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests und Pruefungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the Docker image runs on.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyflakes

      - name: pyflakes
        run: python -m pyflakes mail2nas tests scripts/regenerate-bootstrap.py

      - name: bootstrap.sh aktuell?
        run: python scripts/regenerate-bootstrap.py --check

      - name: Shell-Skripte
        run: |
          for script in scripts/bootstrap.sh scripts/proxmox/*.sh; do
            bash -n "$script"
          done
          shellcheck -S warning scripts/proxmox/*.sh

      - name: pytest
        run: python -m pytest -q

      - name: Offline-Bootstrap baut ein lauffaehiges Projekt
        run: |
          target="$(mktemp -d)/mail2nas"
          bash scripts/bootstrap.sh "$target"
          cd "$target"
          python -m pytest -q

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t mail2nas:ci .

      - name: Container startet ohne Konfiguration
        run: |
          docker run -d --name mail2nas-ci -p 8080:8080 mail2nas:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              docker exec mail2nas-ci python -m mail2nas.cli status
              docker exec mail2nas-ci python -m mail2nas.cli password >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs mail2nas-ci
          exit 1

      - name: Log bei Fehler
        if: failure()
        run: docker logs mail2nas-ci || true
